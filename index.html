<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>namlıboss✌🏼</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 18px;
      background: #090909; color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(900px, 100%); margin: 0 auto; }
    header { text-align: center; margin-bottom: 34px; }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 7vw, 3.5rem); }
    header p { color: #aaa; margin: 0; }
    .video-card {
      background: #151515; border: 1px solid #292929;
      border-radius: 18px; padding: 16px; margin: 22px 0;
    }
    h2 { font-size: 1.1rem; margin: 0 0 13px; }
    video { display: block; width: 100%; max-height: 75vh; background: #000; border-radius: 12px; }
    footer { text-align: center; color: #777; margin-top: 34px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>✌🏼 NAMLIBOSS ✌🏼</h1>
      <p>Videolarıma hoş geldin</p>
    </header>

    <section class="video-card">
      <h2>Video 1</h2>
      <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Tarayıcın bu videoyu oynatamıyor.
      </video>
    </section>

    <section class="video-card">
      <h2>Video 2</h2>
      <video controls playsinline preload="metadata">
        <source src="IMG_4128.mp4" type="video/mp4">
        Tarayıcın bu videoyu oynatamıyor.
      </video>
    </section>

    <footer>namlıboss✌🏼</footer>
  </main>
</body>
</html>
