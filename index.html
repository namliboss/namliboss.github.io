<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>namlıboss✌🏼</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 28px 16px; color: #fff; font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(ellipse at top, #242424 0%, #101010 42%, #050505 100%);
    }
    main { width: min(100%, 1000px); text-align: center; }
    h1 {
      margin: 0 0 22px; font-size: clamp(2.2rem, 8vw, 5rem);
      letter-spacing: -2px; font-weight: 900;
      text-shadow: 0 4px 24px rgba(255,255,255,.14);
    }
    .video-frame {
      padding: 8px; border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px; background: rgba(255,255,255,.06);
      box-shadow: 0 18px 65px rgba(0,0,0,.65);
    }
    video { display: block; width: 100%; max-height: 75vh; border-radius: 11px; background: #000; }
    p { margin: 17px 0 0; color: #aaa; font-size: .9rem; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <h1>namlıboss✌🏼</h1>
    <div class="video-frame">
      <video controls autoplay playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
        Tarayıcınız video oynatmayı desteklemiyor.
      </video>
    </div>
    <p>✌🏼 NAMLIBOSS ✌🏼</p>
  </main>
</body>
</html>
